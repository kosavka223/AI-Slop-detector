syntax = "proto3";

package analyzer.v1;

// Контракт: ML-модели (NVIDIA Triton) <-> сервисы-анализаторы.
// Изменения только через PR с ревью Team Lead.
service Analyzer {
  // Текстовый анализ (стиль, burstiness, LLM-паттерны)
  rpc AnalyzeText (TextRequest) returns (AnalyzerResponse);

  // Анализ изображений (GenAI-артефакты, OCR)
  rpc AnalyzeImage (ImageRequest) returns (AnalyzerResponse);

  // Здоровье ML-инференса
  rpc Health (HealthRequest) returns (HealthResponse);
}

message TextRequest {
  string email_id = 1;
  string text = 2;
}

message ImageRequest {
  string email_id = 1;
  bytes image_data = 2;
  string image_url = 3; // альтернатива: достать из MinIO/S3
}

message AnalyzerResponse {
  float score = 1; // 0.0 - 1.0
  string reason = 2; // объяснение для XAI
  map<string, string> details = 3; // доп. данные
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model_version = 2;
}